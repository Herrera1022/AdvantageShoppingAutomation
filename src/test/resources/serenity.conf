serenity {
    project.name = "Advantage Online Shopping - Screenplay"
    take.screenshots = AFTER_EACH_STEP
    test.root = co.edu.udea.qa.advantageshopping
    console.colors = true
    # Un navegador nuevo por cada escenario y cada ejemplo de un outline los mantiene independientes (sesión, carrito)
    use.unique.browser = false
    restart.browser.for.each = example
    report {
        accessibility = true
    }
    requirement {
        types = "epic, feature"
    }
}

# Pausa en segundos entre pasos para seguir la ejecución en vivo (0 la desactiva).
# Se cambia desde la consola: -Ddemo.delay.seconds=3
demo.delay.seconds = 1

#headless.mode = true

# Serenity 4 por defecto solo genera json y xml: sin html el reporte no tiene página de detalle por escenario
output.formats = "json,xml,html"

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
  }
  timeouts {
    implicitlywait = 2000
  }
  wait.for.timeout = 30000
}

chrome.switches = """--start-maximized;--window-size=1920,1080;--test-type;--no-sandbox;--ignore-certificate-errors;
                   --disable-popup-blocking;--disable-default-apps;--disable-extensions-file-access-check;
                   --incognito;--disable-infobars;--disable-gpu;--remote-allow-origins=*"""

pages {
    advantageUrl = "https://advantageonlineshopping.com/#/"
}
